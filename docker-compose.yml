version: '3.8'
services:
  server:
    image: peterlipatov/stepa:latest
    ports:
      - "3300:3300"
    restart: always
    env_file:
      - .env
    volumes:
      - ./public:/app/public
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
