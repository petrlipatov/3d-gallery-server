name: Build and Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: peterlipatov/stepa:latest

  deploy:
    # This job runs only after build-and-push is successful
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to the project directory on the server
            cd /home/petr/stepa/server
            
            # Pull the latest version of the docker compose.yml file
            git pull origin main
            
            # Pull the new server image from Docker Hub
            docker compose pull server
            
            # Restart the services with the new image
            # The -d flag runs it in detached mode
            docker compose up -d --remove-orphans
            
            # Clean up old, unused docker images to save space
            docker image prune -af
